name: Configurar .env del sitio (una sola vez)

# ==============================================================================
# Workflow de UN SOLO USO: escribe el .env de producción (BD Neon, Google SSO
# y flag de accesos demo) directamente en el wwwroot del sitio usando WebDeploy.
#
# ¿Por qué existe? El .env contiene secretos que NO deben estar en el repo.
# Este workflow los toma de los SECRETS de GitHub (cifrados) y los publica
# como un único archivo al sitio.
#
# SECRETOS QUE LEE:
#   DB_CONNECTION_STRING  → cadena de conexión PostgreSQL (Neon, rol user_app)
#   GOOGLE_CLIENT_ID      → OAuth client id de Google (opcional)
#   GOOGLE_CLIENT_SECRET  → OAuth client secret de Google (opcional)
#   ENABLE_DEMO_LOGIN     → "true" habilita los accesos rápidos demo en producción
#
# NO se dispara solo: solo manualmente (workflow_dispatch) desde Actions →
# "Configurar .env del sitio" → Run. Puede re-ejecutarse cuando cambie algún
# secreto (sobrescribe el .env del sitio).
# ==============================================================================

on:
  workflow_dispatch:

jobs:
  subir_env:
    runs-on: windows-latest

    steps:
      - name: Preparar .env (el secreto NUNCA se imprime)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\env_payload | Out-Null
          $content = @"
          # Configuración de producción - generado por workflow
          DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
          ENABLE_DEMO_LOGIN=${{ secrets.ENABLE_DEMO_LOGIN }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          "@
          # Quitar indentación del here-string y escribir
          ($content -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`r`n" |
            Set-Content -Path .\env_payload\.env -NoNewline -Encoding ascii
          Write-Output "Archivo .env creado (contenido oculto)."

      - name: Publicar .env al wwwroot con WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.MSA_SITE }}
          server-computer-name: ${{ secrets.MSA_SERVER }}
          server-username: ${{ secrets.MSA_USERNAME }}
          server-password: ${{ secrets.MSA_PASSWORD }}
          source-path: \env_payload\
          # sin target-delete: los demás archivos del sitio no se tocan
